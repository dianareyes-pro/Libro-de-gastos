<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — Mi libro de gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gastos.css">
</head>
<body class="auth-body">

<div class="auth-tarjeta">
  <h1>Mi libro de gastos</h1>
  <div class="subtitulo">Inicia sesión para continuar</div>

  <form id="formLogin" class="auth-form">
    <input type="text" id="username" placeholder="Usuario" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <button type="submit" class="registrar">Entrar</button>
  </form>
  <div id="mensaje" class="mensaje error" style="text-align:center;"></div>

  <div class="auth-enlace">
    ¿No tienes cuenta? <a href="registro.html">Crea una aquí</a>
  </div>
</div>

<script>
document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('mensaje');
  msg.textContent = '';

  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });

  if (res.ok) {
    window.location.href = 'index.html';
  } else {
    const datos = await res.json().catch(() => ({}));
    msg.textContent = datos.error || 'No se pudo iniciar sesión.';
  }
});
</script>

</body>
</html>
