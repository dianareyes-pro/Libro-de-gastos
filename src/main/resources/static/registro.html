<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta — Mi libro de gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gastos.css">
</head>
<body class="auth-body">

<div class="auth-tarjeta">
  <h1>Mi libro de gastos</h1>
  <div class="subtitulo">Crea tu cuenta</div>

  <form id="formRegistro" class="auth-form">
    <input type="text" id="nombre" placeholder="Tu nombre" required>
    <input type="text" id="username" placeholder="Usuario" required>
    <input type="password" id="password" placeholder="Contraseña" required>
    <button type="submit" class="registrar">Crear cuenta</button>
  </form>
  <div id="mensaje" class="mensaje" style="text-align:center;"></div>

  <div class="auth-enlace">
    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
  </div>
</div>

<script>
document.getElementById('formRegistro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nombre = document.getElementById('nombre').value.trim();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('mensaje');
  msg.textContent = '';
  msg.className = 'mensaje';

  const res = await fetch('/api/auth/registro', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nombre, username, password })
  });

  if (res.status === 201) {
    msg.textContent = 'Cuenta creada. Redirigiendo a inicio de sesión...';
    msg.className = 'mensaje exito';
    setTimeout(() => window.location.href = 'login.html', 1200);
  } else {
    const datos = await res.json().catch(() => ({}));
    msg.textContent = datos.error || 'No se pudo crear la cuenta.';
    msg.className = 'mensaje error';
  }
});
</script>

</body>
</html>
